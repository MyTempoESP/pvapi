openapi: "3.0.3"
info:
  title: PvAuto — API de Integração
  version: "1.0.0"
  license:
    name: Proprietary
    url: https://pvauto.linhazero.com
  description: |
    API de integração com a plataforma PvAuto:
    catálogo de produtos, consulta de remessas públicas e checkout.

    **Autenticação:** endpoints de produto, remessa e estabelecimento são
    públicos. **Checkout exige token** via HTTP header
    `Authorization: Bearer pv_17ff383f9d4774e1eabfa5b3307a691a8c5eb6d1644bc257d628a795bbfa39eb`.

    **Fluxo principal (cartless):**
    1. Consultar produtos via `GET /produtos?token={token_de_remessa}` —
       retorna os produtos da remessa (`produtos`, onde `id` é o `package_id`)
       e os pontos de retirada (`retiradas`).
    2. Confirmar checkout via `POST /checkouts/confirm` com os `package_id`
       obtidos no passo anterior (campo `id` de cada produto) — sem carrinho
       intermediário.

    **Identificação do cliente:**
     - Ao menos um de `cpf` ou `telephone` é obrigatório.
     - A senha da conta é os dígitos do telefone se informado, ou aleatória (16 chars).
     - CPF e telephone nunca aparecem na resposta do checkout nem em logs.

    **Rate limit:**
     - `POST /checkouts/confirm` limita a 1 checkout por cliente a cada 60 segundos.
       Requisições acima do limite retornam HTTP 429 com `retry_after` (segundos).
servers:
  - url: https://pvauto.linhazero.com
    description: Produção
tags:
  - name: Checkout
    description: Finalização da compra
  - name: Remessas
    description: Consulta de remessas públicas
  - name: Produtos
    description: Catálogo de produtos com filtros
  - name: Estabelecimentos
    description: Consulta de lojas e seus vínculos
paths:
  # ═══════════════════════════════════════════════════════════════
  # Checkout
  # ═══════════════════════════════════════════════════════════════
  /checkouts/confirm:
    post:
      security:
        - Token de API: []
      tags: [Checkout]
      summary: Confirma checkout (compra)
      description: |
        Reserva estoque e gera QR code para retirada. Requer token
        de API via HTTP header `Authorization: Bearer pv_17ff383f9d4774e1eabfa5b3307a691a8c5eb6d1644bc257d628a795bbfa39eb`.

        **Rate limit:** 1 checkout por cliente a cada 60 segundos.
        Exceder o limite retorna HTTP 429 com `retry_after`.

        Os `package_id` são o `id` de cada produto retornado em
        `GET /produtos?token={token_de_remessa}`.

        **Identificação do cliente:** ao menos um de `cpf` ou
        `telephone` é obrigatório. A senha é os dígitos do
        telefone se informado, ou aleatória (16 chars).
      operationId: confirmarCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmarCheckoutRequest"
      responses:
        "200":
          description: Checkout confirmado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaCheckout"
        "400":
          $ref: "#/components/responses/ErroRequisicao"
        "401":
          description: Token de API ausente ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "409":
          description: Estoque insuficiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "422":
          description: Pacote não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "429":
          description: Rate limit excedido
          content:
            application/json:
              schema:
                type: object
                required: [success, message, retry_after]
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  retry_after:
                    type: integer
                    description: Segundos restantes para o próximo checkout

  /checkouts/{unique_id}:
    delete:
      security:
        - Token de API: []
      tags: [Checkout]
      summary: Cancela checkout (parcialmente)
      description: |
        Cancela um checkout previamente confirmado. Apenas pacotes com
        status pendente são cancelados (estoque devolvido, reserva removida).
        Pacotes recebidos não são afetados. Se todos os pacotes forem
        cancelados, o checkout é removido.

        O token de API deve pertencer ao mesmo API client que confirmou
        o checkout.
      operationId: cancelarCheckout
      parameters:
        - name: unique_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do checkout (retornado em POST /checkouts/confirm)
      responses:
        "200":
          description: Checkout cancelado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaCancelamentoCheckout"
        "403":
          description: Token de API não pertence ao mesmo API client do checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "404":
          description: Checkout não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"

  # ═══════════════════════════════════════════════════════════════
  # Produtos
  # ═══════════════════════════════════════════════════════════════
  /produtos:
    get:
      tags: [Produtos]
      summary: Lista produtos públicos via token de remessa
      description: |
        Lista produtos aprovados de uma remessa. Cada produto inclui preço,
        estoque e demais atributos. Os pontos de retirada são retornados
        separadamente no array `retiradas`.

        **Importante:** o `id` de cada produto é o `package_id` a ser
        usado no `POST /checkouts/confirm`.

        Sem token, retorna arrays vazios.
      operationId: listarProdutos
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Token de remessa (UUID)
      responses:
        "200":
          description: Lista de produtos e pontos de retirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaListaProdutosToken"
        "400":
          description: Token inválido (formato UUID esperado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "404":
          description: Remessa não encontrada para o token informado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "410":
          description: Remessa arquivada, não está mais disponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"

  /produtos/{product}:
    get:
      tags: [Produtos]
      summary: Visualiza produto público por ID
      description: |
        Retorna os detalhes de um produto específico aprovado, incluindo
        o campo `pickups` com os pacotes e pontos de retirada disponíveis.
      operationId: verProduto
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
          description: ID do produto
      responses:
        "200":
          description: Detalhes do produto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaProduto"
        "404":
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"

  # ═══════════════════════════════════════════════════════════════
  # Remessas públicas
  # ═══════════════════════════════════════════════════════════════
  /remessas-publicas:
    get:
      tags: [Remessas]
      summary: Lista todas as remessas ativas
      description: |
        Retorna a lista de remessas/consignments ativas com status
        aprovado, incluindo informações de ponto de retirada,
        monitor responsável e loja proprietária.
      operationId: listarRemessasPublicas
      parameters:
        - name: loja
          in: query
          required: false
          schema:
            type: integer
          description: ID da loja (pode ser repetido para múltiplas lojas, ex. ?loja=1&loja=2)
      responses:
        "200":
          description: Lista de remessas ativas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaListaRemessasPublicas"

  # ═══════════════════════════════════════════════════════════════
  # Estabelecimentos (lojas)
  # ═══════════════════════════════════════════════════════════════
  /estabelecimentos:
    get:
      tags: [Estabelecimentos]
      summary: Lista lojas ativas
      description: |
        Retorna a lista de lojas/estabelecimentos ativos na plataforma.
      operationId: listarEstabelecimentos
      responses:
        "200":
          description: Lista de lojas ativas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaListaLojas"

# ═════════════════════════════════════════════════════════════════
# Componentes
# ═════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    Token de API:
      type: http
      scheme: bearer
      description: "Inclua no header: `Authorization: Bearer pv_17ff383f9d4774e1eabfa5b3307a691a8c5eb6d1644bc257d628a795bbfa39eb`."
  schemas:
    # ── Genéricos ───────────────────────────────────────────────
    RespostaOk:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "operação concluída!"

    RespostaErro:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    # ── Endereço ────────────────────────────────────────────────
    Endereco:
      type: object
      properties:
        street:
          type: string
        number:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
        cep:
          type: string
        complement:
          type: string

    # ── Checkout ────────────────────────────────────────────────
    ItemCheckout:
      type: object
      required: [package_id, quantity]
      properties:
        package_id:
          type: integer
          minimum: 1
          description: ID do pacote — é o `id` recebido na consulta dos produtos via token (`GET /produtos?token={token_de_remessa}`)
        quantity:
          type: integer
          minimum: 1
          description: Quantidade desejada deste pacote

    ConfirmarCheckoutRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ItemCheckout"
        telephone:
          type: string
          description: Telefone do cliente. Dígitos são extraídos; formatação é ignorada. Usado como senha da conta quando informado, e como identidade quando CPF não é fornecido.
        cpf:
          type: string
          description: CPF do cliente. Deve ter exatamente 11 dígitos após remoção de formatação. Identifica o cliente; tem prioridade sobre telephone.
        client_name:
          type: string
          description: Nome do cliente (opcional).
        callback:
          type: string
          description: |
            URL do webhook a ser chamado quando o pedido for recebido (opcional).
            O callback será um POST com body JSON contendo:
            - product_id (integer): ID do produto
            - package_id (integer): ID do pacote
            - unique_id (string): identificador único da venda
      example:
        items:
          - package_id: 42
            quantity: 1
        telephone: "11988887777"
        cpf: "12345678901"
        client_name: "Nome do Cliente"
        callback: "https://example.com/webhook/order-received"

    RespostaCancelamentoCheckout:
      type: object
      required: [success, cancelled_count, remaining_count]
      properties:
        success:
          type: boolean
          example: true
        cancelled_count:
          type: integer
          description: Quantidade de pacotes pendentes cancelados
        remaining_count:
          type: integer
          description: Quantidade de pacotes recebidos restantes

    RespostaCheckout:
      type: object
      required: [success, message, unique_id, status, qr_codes]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "checkout confirmed"
        unique_id:
          type: string
          format: uuid
          description: Identificador único da transação
        status:
          type: string
          example: paid
          description: Status da transação
        qr_codes:
          type: array
          description: QR codes, um por pacote reservado
          items:
            type: object
            properties:
              package_id:
                type: integer
                description: ID do pacote
              qr_code:
                type: string
                description: QR code em data URI (PNG base64) do unique_id do package_reserved

    # ── Remessa / Consignment ───────────────────────────────────
    RecursoRemessa:
      type: object
      properties:
        id:
          type: integer
          description: ID da remessa
        commission_type:
          type: string
          description: Tipo de comissão (fixed / percentage)
        commission_value:
          type: number
          description: Valor da comissão (decimal)
        code:
          type: string
          description: Código da remessa
        slug:
          type: string
          description: Slug identificador
        status:
          type: string
          description: Status da remessa
        destination:
          type: string
          description: Nome do ponto de retirada
        responsibleMonitor:
          type: string
          description: Nome do monitor responsável
        created_at:
          type: string
          format: date-time
          description: Data de criação

    RecursoRemessaPublica:
      type: object
      properties:
        id:
          type: integer
          description: ID da remessa
        commission_type:
          type: string
          description: Tipo de comissão (fixed / percentage)
        commission_value:
          type: number
          description: Valor da comissão (decimal)
        code:
          type: string
          description: Código da remessa
        slug:
          type: string
          description: Slug identificador
        status:
          type: string
          description: Status da remessa
        destination:
          type: string
          description: Nome do ponto de retirada
        responsibleMonitor:
          type: string
          description: Nome do monitor responsável
        shop:
          type: object
          properties:
            id:
              type: integer
              description: ID da loja
            name:
              type: string
              description: Nome da loja
          required: [id, name]
          description: Loja proprietária da remessa
        created_at:
          type: string
          format: date-time
          description: Data de criação

    RespostaListaRemessas:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: "remessas listadas com sucesso"
        data:
          type: array
          items:
            $ref: "#/components/schemas/RecursoRemessa"

    RespostaListaRemessasPublicas:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: "remessas listadas com sucesso"
        data:
          type: array
          items:
            $ref: "#/components/schemas/RecursoRemessaPublica"

    # ── Produto ─────────────────────────────────────────────────
    EspecificacaoProduto:
      type: object
      properties:
        name:
          type: string
        value:
          type: string

    ProductPickupResource:
      type: object
      properties:
        package_id:
          type: integer
          description: ID do pacote (usado no checkout)
        price:
          type: number
          description: Preço do pacote (decimal)
        discount:
          type: number
          description: Desconto do pacote (decimal)
        quantity:
          type: integer
          description: Estoque disponível neste pacote
        pickup_name:
          type: string
          description: Nome do ponto de retirada
        pickup_date:
          type: string
          description: Data/hora do ponto de retirada
        address:
          $ref: "#/components/schemas/Endereco"

    RecursoProduto:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        stock:
          type: integer
        price:
          type: number
          description: Preço (decimal)
        discount:
          type: number
          description: Desconto (decimal)
        featured:
          type: boolean
          description: Produto em destaque
        code:
          type: string
        uuid:
          type: string
        platform_cut:
          type: number
          description: Repasse da plataforma (decimal)
        platform_cut_type:
          type: string
          description: Tipo de repasse (fixed / percentage)
        colors:
          type: array
          items:
            type: string
        sizes:
          type: array
          items:
            type: string
        allowCustomName:
          type: boolean
        allowCustomModality:
          type: boolean
        allowCustomColorSelection:
          type: boolean
        moderation_status:
          type: string
        category:
          type: string
        category_id:
          type: integer
        imageUrl:
          type: string
        description:
          type: string
        specificationsImages:
          type: array
          items:
            type: string
        descriptionImages:
          type: array
          items:
            type: string
        deliveryImages:
          type: array
          items:
            type: string
        specifications:
          type: array
          items:
            $ref: "#/components/schemas/EspecificacaoProduto"
        pickups:
          type: array
          items:
            $ref: "#/components/schemas/ProductPickupResource"
          description: |
            Pacotes disponíveis para este produto, com preço, estoque
            e endereço do ponto de retirada. O `package_id` de cada
            pickup é usado no POST /checkouts/confirm.

    # ── Produto via token de remessa ────────────────────────────
    ProductConsignmentResource:
      type: object
      properties:
        id:
          type: integer
          description: ID do pacote (package_id) — usar no POST /checkouts/confirm
        name:
          type: string
          description: Nome do produto
        stock:
          type: integer
          description: Estoque disponível nesta remessa
        price:
          type: number
          description: Preço (decimal)
        discount:
          type: number
          description: Desconto (decimal)
        featured:
          type: boolean
          description: Produto em destaque
        code:
          type: string
          description: Código do produto
        uuid:
          type: string
          description: UUID do produto
        colors:
          type: array
          items:
            type: string
        sizes:
          type: array
          items:
            type: string
        allowCustomName:
          type: boolean
        allowCustomModality:
          type: boolean
        allowCustomColorSelection:
          type: boolean
        category:
          type: string
        category_id:
          type: integer
        imageUrl:
          type: string
        description:
          type: string
        specificationsImages:
          type: array
          items:
            type: string
        descriptionImages:
          type: array
          items:
            type: string
        deliveryImages:
          type: array
          items:
            type: string
        specifications:
          type: array
          items:
            $ref: "#/components/schemas/EspecificacaoProduto"

    ConsignmentPickupAddressResource:
      type: object
      properties:
        street:
          type: string
        number:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
        cep:
          type: string
        complement:
          type: string

    ConsignmentPickupResource:
      type: object
      properties:
        name:
          type: string
          description: Nome do ponto de retirada
        address:
          $ref: "#/components/schemas/ConsignmentPickupAddressResource"

    RespostaListaProdutosToken:
      type: object
      required: [success, message, produtos, retiradas]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: "Produtos listados com sucesso!"
        produtos:
          type: array
          items:
            $ref: "#/components/schemas/ProductConsignmentResource"
        retiradas:
          type: array
          items:
            $ref: "#/components/schemas/ConsignmentPickupResource"

    RespostaListaProdutos:
      type: object
      required: [success, message, produtos]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: "Produtos listados com sucesso!"
        produtos:
          type: array
          items:
            $ref: "#/components/schemas/RecursoProduto"

    RespostaProduto:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: "produto encontrado!"
        data:
          $ref: "#/components/schemas/RecursoProduto"

    # ── Estabelecimento / Loja ──────────────────────────────────
    RecursoEstabelecimento:
      type: object
      properties:
        id:
          type: integer
          description: ID da loja
        name:
          type: string
          description: Nome da loja
        slug:
          type: string
          description: Slug identificador
        email:
          type: string
          description: Email da loja
        phone:
          type: string
          description: Telefone da loja
        pix_key:
          type: string
          description: Chave PIX para recebimento
        status:
          type: string
          description: Status da loja

    RespostaListaLojas:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: "estabelecimentos listados com sucesso"
        data:
          type: array
          items:
            $ref: "#/components/schemas/RecursoEstabelecimento"

  responses:
    ErroRequisicao:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"
