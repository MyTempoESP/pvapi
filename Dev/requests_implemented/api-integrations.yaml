openapi: "3.0.3"
info:
  title: PvAuto — API de Integração
  version: "1.0.0"
  license:
    name: Proprietary
    url: https://pvauto.linhazero.com
  description: |
    Rotas públicas para integração com a plataforma PvAuto:
    catálogo de produtos, consulta de remessas públicas e checkout.

    **Fluxo principal (cartless):**
    1. Consultar produtos via `GET /produtos` (cada produto já inclui `pickups`
       com `package_id`, preço, estoque e endereço do ponto de retirada).
    2. Confirmar checkout via `POST /checkouts/confirm` com os `package_id`
       obtidos no passo anterior — sem carrinho intermediário.

    **Criação automática de cliente:**
     - Se `client_email` for informado no checkout, uma conta de cliente é
       criada (best-effort, após a resposta HTTP). Se SMTP estiver configurado,
       um email de boas-vindas com senha gerada é enviado.
     - O parâmetro `client_name` é opcional — um nome é derivado do email
       quando omitido.

    **Idempotência:**
     - `POST /checkouts/confirm` é idempotente via `external_reference`.
       Mesmo `external_reference` retorna o mesmo `unique_id`.
security: []

servers:
  - url: https://pvauto.linhazero.com
    description: Produção
tags:
  - name: Checkout
    description: Finalização da compra
  - name: Remessas
    description: Consulta de remessas públicas
  - name: Produtos
    description: Catálogo de produtos com filtros
  - name: Estabelecimentos
    description: Consulta de lojas e seus vínculos
paths:
  # ═══════════════════════════════════════════════════════════════
  # Checkout
  # ═══════════════════════════════════════════════════════════════
  /checkouts/confirm:
    post:
      tags: [Checkout]
      summary: Confirma checkout (compra)
      description: |
        Reserva estoque e gera QR code para retirada.

        **Idempotente** — o mesmo `external_reference` retorna o `unique_id`
        original sem duplicar a transação.

        Os `package_id` são obtidos no campo `pickups` dos produtos
        (`GET /produtos` ou `GET /produtos/:product`).

        **Criação automática de cliente:** se `client_email` for informado,
        uma conta de cliente é criada (best-effort) após o checkout. Um nome
        é derivado do email caso `client_name` seja omitido. Se SMTP estiver
        configurado, um email de boas-vindas com a senha gerada é enviado.
      operationId: confirmarCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmarCheckoutRequest"
      responses:
        "200":
          description: Checkout confirmado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaCheckout"
        "400":
          $ref: "#/components/responses/ErroRequisicao"
        "409":
          description: Estoque insuficiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "422":
          description: Pacote não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"

  # ═══════════════════════════════════════════════════════════════
  # Produtos
  # ═══════════════════════════════════════════════════════════════
  /produtos:
    get:
      tags: [Produtos]
      summary: Lista produtos públicos com filtros
      description: |
        Lista produtos aprovados do catálogo público. Cada produto inclui
        o campo `pickups` com os pacotes disponíveis (preço, estoque,
        ponto de retirada).

        **Filtros disponíveis (query params, multivalorados):**
        - `loja` — filtra por ID(s) de loja (ex: `?loja=1&loja=2`)
        - `remessa` — filtra por ID(s) de remessa (ex: `?remessa=3`)

        Sem filtros, retorna todos os produtos aprovados.
      operationId: listarProdutos
      parameters:
        - name: loja
          in: query
          schema:
            type: array
            items:
              type: integer
          description: ID da loja (pode ser repetido para múltiplas lojas)
          example: [1]
        - name: remessa
          in: query
          schema:
            type: array
            items:
              type: integer
          description: ID da remessa (pode ser repetido para múltiplas remessas)
          example: [3]
      responses:
        "200":
          description: Lista de produtos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaListaProdutos"

  /produtos/{product}:
    get:
      tags: [Produtos]
      summary: Visualiza produto público por ID
      description: |
        Retorna os detalhes de um produto específico aprovado, incluindo
        o campo `pickups` com os pacotes e pontos de retirada disponíveis.
      operationId: verProduto
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
          description: ID do produto
      responses:
        "200":
          description: Detalhes do produto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaProduto"
        "404":
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"

  # ═══════════════════════════════════════════════════════════════
  # Remessas públicas
  # ═══════════════════════════════════════════════════════════════
  /remessas-publicas:
    get:
      tags: [Remessas]
      summary: Lista todas as remessas ativas
      description: |
        Retorna a lista de remessas/consignments ativas com status
        aprovado, incluindo informações de ponto de retirada e
        monitor responsável.
      operationId: listarRemessasPublicas
      responses:
        "200":
          description: Lista de remessas ativas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaListaRemessas"

  # ═══════════════════════════════════════════════════════════════
  # Remessas por loja
  # ═══════════════════════════════════════════════════════════════
  /estabelecimentos/{shop}/remessas:
    get:
      tags: [Remessas]
      summary: Lista remessas de uma loja específica
      description: |
        Retorna todas as remessas/consignments vinculadas a uma loja
        específica, identificada pelo slug.
      operationId: listarRemessasPorLoja
      parameters:
        - name: shop
          in: path
          required: true
          schema:
            type: string
          description: Slug da loja (identificador textual)
      responses:
        "200":
          description: Lista de remessas da loja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaListaRemessas"
        "404":
          description: Loja não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"

  # ═══════════════════════════════════════════════════════════════
  # Estabelecimentos (lojas)
  # ═══════════════════════════════════════════════════════════════
  /estabelecimentos:
    get:
      tags: [Estabelecimentos]
      summary: Lista lojas ativas
      description: |
        Retorna a lista de lojas/estabelecimentos ativos na plataforma.
      operationId: listarEstabelecimentos
      responses:
        "200":
          description: Lista de lojas ativas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaListaLojas"

# ═════════════════════════════════════════════════════════════════
# Componentes
# ═════════════════════════════════════════════════════════════════
components:
  schemas:
    # ── Genéricos ───────────────────────────────────────────────
    RespostaOk:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "operação concluída!"

    RespostaErro:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    # ── Endereço ────────────────────────────────────────────────
    Endereco:
      type: object
      properties:
        street:
          type: string
        number:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
        cep:
          type: string
        complement:
          type: string

    # ── Checkout ────────────────────────────────────────────────
    ItemCheckout:
      type: object
      required: [package_id, quantity]
      properties:
        package_id:
          type: integer
          minimum: 1
          description: ID do pacote (obtido no campo `pickups` dos produtos)
        quantity:
          type: integer
          minimum: 1
          description: Quantidade desejada deste pacote

    ConfirmarCheckoutRequest:
      type: object
      required: [value_paid, external_reference, items]
      properties:
        value_paid:
          type: string
          description: 'Valor pago (string decimal, ex: "600")'
        external_reference:
          type: string
          description: Referência externa única (chave de idempotência). Mesmo valor sempre retorna o mesmo unique_id.
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ItemCheckout"
        client_email:
          type: string
          description: Email para criação automática da conta de cliente após o checkout
        client_name:
          type: string
          description: Nome para a conta de cliente (derivado do email se omitido)
      example:
        value_paid: "600"
        external_reference: "pay_abc123"
        items:
          - package_id: 42
            quantity: 1
        client_email: "cliente@email.com"
        client_name: "Nome do Cliente"

    RespostaCheckout:
      type: object
      required: [success, message, unique_id, status]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "checkout confirmed"
        unique_id:
          type: string
          format: uuid
          description: Identificador único da transação
        status:
          type: string
          example: paid
          description: Status da transação
        qr_code:
          type: string
          description: QR code em data URI (PNG base64)

    # ── Remessa / Consignment ───────────────────────────────────
    RecursoRemessa:
      type: object
      properties:
        id:
          type: integer
          description: ID da remessa
        commission_type:
          type: string
          description: Tipo de comissão (fixed / percentage)
        commission_value:
          type: number
          description: Valor da comissão (decimal)
        code:
          type: string
          description: Código da remessa
        slug:
          type: string
          description: Slug identificador
        status:
          type: string
          description: Status da remessa
        destination:
          type: string
          description: Nome do ponto de retirada
        responsibleMonitor:
          type: string
          description: Nome do monitor responsável
        created_at:
          type: string
          format: date-time
          description: Data de criação

    RespostaListaRemessas:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: "remessas listadas com sucesso"
        data:
          type: array
          items:
            $ref: "#/components/schemas/RecursoRemessa"

    # ── Produto ─────────────────────────────────────────────────
    EspecificacaoProduto:
      type: object
      properties:
        name:
          type: string
        value:
          type: string

    ProductPickupResource:
      type: object
      properties:
        package_id:
          type: integer
          description: ID do pacote (usado no checkout)
        price:
          type: number
          description: Preço do pacote (decimal)
        discount:
          type: number
          description: Desconto do pacote (decimal)
        quantity:
          type: integer
          description: Estoque disponível neste pacote
        pickup_name:
          type: string
          description: Nome do ponto de retirada
        pickup_date:
          type: string
          description: Data/hora do ponto de retirada
        address:
          $ref: "#/components/schemas/Endereco"

    RecursoProduto:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        stock:
          type: integer
        price:
          type: number
          description: Preço (decimal)
        discount:
          type: number
          description: Desconto (decimal)
        featured:
          type: boolean
          description: Produto em destaque
        code:
          type: string
        uuid:
          type: string
        platform_cut:
          type: number
          description: Repasse da plataforma (decimal)
        platform_cut_type:
          type: string
          description: Tipo de repasse (fixed / percentage)
        colors:
          type: array
          items:
            type: string
        sizes:
          type: array
          items:
            type: string
        allowCustomName:
          type: boolean
        allowCustomModality:
          type: boolean
        allowCustomColorSelection:
          type: boolean
        moderation_status:
          type: string
        category:
          type: string
        category_id:
          type: integer
        imageUrl:
          type: string
        description:
          type: string
        specificationsImages:
          type: array
          items:
            type: string
        descriptionImages:
          type: array
          items:
            type: string
        deliveryImages:
          type: array
          items:
            type: string
        specifications:
          type: array
          items:
            $ref: "#/components/schemas/EspecificacaoProduto"
        pickups:
          type: array
          items:
            $ref: "#/components/schemas/ProductPickupResource"
          description: |
            Pacotes disponíveis para este produto, com preço, estoque
            e endereço do ponto de retirada. O `package_id` de cada
            pickup é usado no POST /checkouts/confirm.

    RespostaListaProdutos:
      type: object
      required: [success, message, produtos]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: "Produtos listados com sucesso!"
        produtos:
          type: array
          items:
            $ref: "#/components/schemas/RecursoProduto"

    RespostaProduto:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: "produto encontrado!"
        data:
          $ref: "#/components/schemas/RecursoProduto"

    # ── Estabelecimento / Loja ──────────────────────────────────
    RecursoEstabelecimento:
      type: object
      properties:
        id:
          type: integer
          description: ID da loja
        name:
          type: string
          description: Nome da loja
        slug:
          type: string
          description: Slug identificador
        email:
          type: string
          description: Email da loja
        phone:
          type: string
          description: Telefone da loja
        pix_key:
          type: string
          description: Chave PIX para recebimento
        status:
          type: string
          description: Status da loja

    RespostaListaLojas:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: "estabelecimentos listados com sucesso"
        data:
          type: array
          items:
            $ref: "#/components/schemas/RecursoEstabelecimento"

  responses:
    ErroRequisicao:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespostaErro"
