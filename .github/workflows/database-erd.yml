name: Generate and Upload Database ERD & Documentation Diagrams

on:
  push:
    branches:
      - wip
    paths:
      - 'internal/database/migrations/**'
      - 'Dev/docs/**.puml'
  workflow_dispatch:

concurrency:
  group: erd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Cache Go Binaries
        uses: actions/cache@v4
        id: go-bin-cache
        with:
          path: ~/go/bin
          key: go-bin-${{ runner.os }}-${{ hashFiles('.github/workflows/database-erd.yml') }}

      - name: Install Migration Tools & Planter
        if: steps.go-bin-cache.outputs.cache-hit != 'true'
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          go install github.com/achiku/planter@latest
      - name: Restore Go Bin to PATH
        if: steps.go-bin-cache.outputs.cache-hit == 'true'
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run Database Migrations
        run: |
          migrate -path internal/database/migrations \
                  -database "postgres://runner:password@localhost:5432/app_db?sslmode=disable" \
                  up

      - name: Generate PlantUML Schema Text
        run: |
          mkdir -p Dev/docs
          planter "postgres://runner:password@localhost:5432/app_db?sslmode=disable" -o Dev/docs/erd.puml

      - name: Render All Diagrams to PNG (ERD + Docs)
        run: |
          echo "Downloading headless graphviz rendering support..."
          sudo apt-get update && sudo apt-get install -y graphviz

          echo "Downloading official PlantUML binary execution payload..."
          curl -o plantuml.jar -L "https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar"

          echo "Compiling system diagrams locally..."
          java -jar plantuml.jar -v -tpng "Dev/docs/**.puml"

      - name: Ship Compiled PNG Images to n8n Vault
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_DIAGRAM_WEBHOOK }}
        run: |
          shopt -s nullglob
          for filepath in Dev/docs/*.png; do
            filename=$(basename "$filepath")
            echo "Uploading: $filename"
            curl -fsS -X POST "$N8N_WEBHOOK_URL" \
              -F "file=@$filepath" \
              -F "filename=$filename" \
              -F "category=Database-Architecture"
          done
