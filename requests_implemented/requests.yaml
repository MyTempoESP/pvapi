openapi: 3.0.3
info:
  title: PV API implemented requests
  version: 1.0.0
  description: Current implemented HTTP requests from routes.go and api_requests_test.go.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
  - name: users
  - name: permissions
  - name: shops
  - name: categories
  - name: products
  - name: consignees
  - name: consignments
  - name: pickups
  - name: reports
  - name: cart
  - name: payments
  - name: admin
paths:
  /login:
    post:
      tags: [auth]
      summary: Login
      operationId: login
      responses:
        '200':
          $ref: '#/components/responses/Login200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /refresh:
    post:
      tags: [auth]
      summary: Refresh JWT
      operationId: refreshJwt
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Refreshjwt200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /register:
    post:
      tags: [auth]
      summary: Register user
      operationId: registerUser
      requestBody:
        $ref: '#/components/requestBodies/RegisterUser'
      responses:
        '200':
          $ref: '#/components/responses/Registeruser200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /logout:
    get:
      tags: [auth]
      summary: Logout
      operationId: logout
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Logout200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /permissions:
    parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
    get:
      tags: [permissions]
      summary: Get permissions by email
      operationId: getPermissionsByEmail
      responses:
        '200':
          $ref: '#/components/responses/Getpermissionsbyemail200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /user:
    get:
      tags: [users]
      summary: Get authenticated user data
      operationId: getUserData
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Getuserdata200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /level:
    get:
      tags: [users]
      summary: Get authenticated user permission level
      operationId: getUserPermissionLevel
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Getuserpermissionlevel200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /perms/admin:
    get:
      tags: [permissions]
      summary: Check admin permission
      operationId: checkAdminPermission
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Checkadminpermission200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /perms/shop:
    get:
      tags: [permissions]
      summary: Check shop permission
      operationId: checkShopPermission
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Checkshoppermission200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /perms/monitor:
    get:
      tags: [permissions]
      summary: Check monitor permission
      operationId: checkMonitorPermission
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Checkmonitorpermission200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /estabelecimentos:
    get:
      tags: [shops]
      summary: List public active shops
      operationId: listShops
      responses:
        '200':
          $ref: '#/components/responses/Listshops200'
    post:
      tags: [shops]
      summary: Create shop
      operationId: createShop
      requestBody:
        $ref: '#/components/requestBodies/CreateShop'
      responses:
        '200':
          $ref: '#/components/responses/Createshop200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /estabelecimentos/all:
    get:
      tags: [shops]
      summary: List all shops for restricted users
      operationId: listRestrictedShops
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Listrestrictedshops200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /estabelecimentos/{shop}:
    parameters:
        - name: shop
          in: path
          required: true
          schema:
            type: string
    get:
      tags: [shops]
      summary: View shop
      operationId: viewShop
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Viewshop200'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [shops]
      summary: Update shop
      operationId: updateShop
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateShop'
      responses:
        '200':
          $ref: '#/components/responses/Updateshop200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [shops]
      summary: Deactivate shop
      operationId: deactivateShop
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Deactivateshop200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /estabelecimentos/{shop}/produtos:
    parameters:
        - name: shop
          in: path
          required: true
          schema:
            type: string
    get:
      tags: [shops, products]
      summary: List public products for a shop
      operationId: listShopProducts
      responses:
        '200':
          $ref: '#/components/responses/Listshopproducts200'
  /categorias:
    get:
      tags: [categories]
      summary: List categories
      operationId: listCategories
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Listcategories200'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [categories]
      summary: Create category
      operationId: createCategory
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateCategory'
      responses:
        '200':
          $ref: '#/components/responses/Createcategory200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /produtos:
    get:
      tags: [products]
      summary: List public products
      operationId: listPublicProducts
      responses:
        '200':
          $ref: '#/components/responses/Listpublicproducts200'
    post:
      tags: [products]
      summary: Create product
      operationId: createProduct
      requestBody:
        $ref: '#/components/requestBodies/CreateProduct'
      responses:
        '200':
          $ref: '#/components/responses/Createproduct200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /produtos/estabelecimento:
    get:
      tags: [products]
      summary: List products owned by authenticated shop
      operationId: listShopOwnerProducts
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Listshopownerproducts200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /produtos/{product}:
    parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
    get:
      tags: [products]
      summary: View public product
      operationId: viewPublicProduct
      responses:
        '200':
          $ref: '#/components/responses/Viewpublicproduct200'
    put:
      tags: [products]
      summary: Update product
      operationId: updateProduct
      requestBody:
        $ref: '#/components/requestBodies/UpdateProduct'
      responses:
        '200':
          $ref: '#/components/responses/Updateproduct200'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [products]
      summary: Delete product
      operationId: deleteProduct
      responses:
        '200':
          $ref: '#/components/responses/Deleteproduct200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /produtos/{product}/destaque:
    parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
    get:
      tags: [products]
      summary: Update product highlight state
      operationId: updateProductHighlight
      responses:
        '200':
          $ref: '#/components/responses/Updateproducthighlight200'
  /produtos/{product}/img/{url}:
    parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
        - name: url
          in: path
          required: true
          schema:
            type: string
    delete:
      tags: [products]
      summary: Delete product image
      operationId: deleteProductImage
      responses:
        '200':
          $ref: '#/components/responses/Deleteproductimage200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /monitores:
    get:
      tags: [consignees]
      summary: List monitors
      operationId: listMonitors
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Listmonitors200'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [consignees]
      summary: Create monitor
      operationId: createMonitor
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateMonitor'
      responses:
        '200':
          $ref: '#/components/responses/Createmonitor200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /pontos:
    get:
      tags: [pickups]
      summary: List pickup locations
      operationId: listPickupLocations
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Listpickuplocations200'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [pickups]
      summary: Create pickup location
      operationId: createPickupLocation
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreatePickupLocation'
      responses:
        '200':
          $ref: '#/components/responses/Createpickuplocation200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /remessas:
    get:
      tags: [consignments]
      summary: List consignments and shipments
      operationId: listConsignments
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Listconsignments200'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [consignments]
      summary: Create consignment
      operationId: createConsignment
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateConsignment'
      responses:
        '200':
          $ref: '#/components/responses/Createconsignment200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /remessas/{consignment}:
    parameters:
        - name: consignment
          in: path
          required: true
          schema:
            type: string
    get:
      tags: [consignments]
      summary: View consignment or shipment
      operationId: viewConsignment
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Viewconsignment200'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [consignments]
      summary: Update consignment
      operationId: updateConsignment
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateConsignment'
      responses:
        '200':
          $ref: '#/components/responses/Updateconsignment200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [consignments]
      summary: Delete consignment
      operationId: deleteConsignment
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Deleteconsignment200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /remessas/{consignment}/produtos:
    parameters:
        - name: consignment
          in: path
          required: true
          schema:
            type: string
    get:
      tags: [consignments]
      summary: List consignment products
      operationId: listConsignmentProducts
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Listconsignmentproducts200'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [consignments]
      summary: Add products to consignment
      operationId: addProductsToConsignment
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/AddProductsToConsignment'
      responses:
        '200':
          $ref: '#/components/responses/Addproductstoconsignment200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /remessas/{consignment}/produtos/{product}:
    parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
        - name: consignment
          in: path
          required: true
          schema:
            type: string
    put:
      tags: [consignments]
      summary: Update consignment product
      operationId: updateConsignmentProduct
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateConsignmentProduct'
      responses:
        '200':
          $ref: '#/components/responses/Updateconsignmentproduct200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /ocorrencias:
    get:
      tags: [reports]
      summary: List reports
      operationId: listReports
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Listreports200'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [reports]
      summary: Create report
      operationId: createReport
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateReport'
      responses:
        '200':
          $ref: '#/components/responses/Createreport200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /ocorrencias/{report}:
    parameters:
        - name: report
          in: path
          required: true
          schema:
            type: integer
    get:
      tags: [reports]
      summary: View report
      operationId: viewReport
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Viewreport200'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [reports]
      summary: Update report
      operationId: updateReport
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateReport'
      responses:
        '200':
          $ref: '#/components/responses/Updatereport200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [reports]
      summary: Delete report
      operationId: deleteReport
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Deletereport200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /carrinho/dados:
    parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
    get:
      tags: [cart]
      summary: List cart products
      operationId: listCartProducts
      responses:
        '200':
          $ref: '#/components/responses/Listcartproducts200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /carrinho/adicionar:
    post:
      tags: [cart]
      summary: Add product to cart
      operationId: addProductToCart
      requestBody:
        $ref: '#/components/requestBodies/AddProductToCart'
      responses:
        '200':
          $ref: '#/components/responses/Addproducttocart200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /carrinho/remover/{item}:
    parameters:
        - name: item
          in: path
          required: true
          schema:
            type: integer
    delete:
      tags: [cart]
      summary: Remove product from cart
      operationId: removeProductFromCart
      responses:
        '200':
          $ref: '#/components/responses/Removeproductfromcart200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /carrinho/atualizar/{item}:
    parameters:
        - name: item
          in: path
          required: true
          schema:
            type: integer
    put:
      tags: [cart]
      summary: Update cart product quantity
      operationId: updateCartProductQuantity
      requestBody:
        $ref: '#/components/requestBodies/UpdateCartQuantity'
      responses:
        '200':
          $ref: '#/components/responses/Updatecartproductquantity200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /carrinho/limpar:
    delete:
      tags: [cart]
      summary: Clear cart
      operationId: clearCart
      requestBody:
        $ref: '#/components/requestBodies/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Clearcart200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /payments/session/create:
    post:
      tags: [payments]
      summary: Create temporary payment session
      operationId: createPaymentSession
      responses:
        '200':
          $ref: '#/components/responses/Createpaymentsession200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /payments/session/validate:
    post:
      tags: [payments]
      summary: Validate temporary payment session
      operationId: validatePaymentSession
      requestBody:
        $ref: '#/components/requestBodies/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Validatepaymentsession200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/payments/pix/cart:
    post:
      tags: [payments]
      summary: Checkout cart with PIX
      operationId: checkoutCartPix
      requestBody:
        $ref: '#/components/requestBodies/CartPixPayment'
      responses:
        '200':
          $ref: '#/components/responses/Checkoutcartpix200'
        '400':
          $ref: '#/components/responses/BadRequest'
  /pagamento/status/{payment}:
    parameters:
        - name: payment
          in: path
          required: true
          schema:
            type: string
    get:
      tags: [payments]
      summary: Check payment status
      operationId: checkPaymentStatus
      responses:
        '200':
          $ref: '#/components/responses/Checkpaymentstatus200'
  /admin/moderacao/pendentes:
    get:
      tags: [admin, products]
      summary: List products pending moderation
      operationId: listPendingModerationProducts
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Listpendingmoderationproducts200'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/moderacao/produtos/{product}/aprovar:
    parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
    post:
      tags: [admin, products]
      summary: Approve product
      operationId: approveProduct
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ModerateProduct'
      responses:
        '200':
          $ref: '#/components/responses/Approveproduct200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/moderacao/produtos/{product}/rejeitar:
    parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
    post:
      tags: [admin, products]
      summary: Reject product
      operationId: rejectProduct
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ModerateProduct'
      responses:
        '200':
          $ref: '#/components/responses/Rejectproduct200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt
  responses:
    BadRequest:
      description: Malformed request response from util.HandleBadRequest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestResponse'
    Unauthorized:
      description: Unauthorized response from auth middleware.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedResponse'
    Login200:
      description: LoginResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginResponse'
    Refreshjwt200:
      description: RefreshJwtResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshJwtResponse'
    Registeruser200:
      description: RegisterUserResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterUserResponse'
    Logout200:
      description: AuthLogoutResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthLogoutResponse'
    Getpermissionsbyemail200:
      description: UserPermissionsResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserPermissionsResponse'
    Getuserdata200:
      description: UserDataResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserDataResponse'
    Getuserpermissionlevel200:
      description: UserLevelResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserLevelResponse'
    Checkadminpermission200:
      description: PermissionCheckResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PermissionCheckResponse'
    Checkshoppermission200:
      description: PermissionCheckResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PermissionCheckResponse'
    Checkmonitorpermission200:
      description: PermissionCheckResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PermissionCheckResponse'
    Listshops200:
      description: ListShopsResponse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListShopsResponse'
    Createshop200:
      description: CreateShopResponse.
      content:
        application/json:
          schema:
