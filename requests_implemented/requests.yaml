              productName:
                type: string
              quantity:
                type: integer
              price:
                type: integer
              color:
                type: string
              description:
                type: string
              category:
                type: string
              discount:
                type: integer
              featured:
                type: boolean
      example:
        products:
          - productId: 1
            productName: aosiddsa
            quantity: 1
            price: 1
            color: '#000000'
            description: dsaokdjsajdoasdjsa
            category: Sem Categoria
            discount: 10
            featured: true
    approve_product:
      type: object
      properties:
        platform_cut:
          type: integer
        platform_cut_type:
          type: string
      example:
        platform_cut: 5
        platform_cut_type: percentage
    create_report:
      type: object
      properties:
        orderId:
          type: integer
        monitor:
          type: string
        moment:
          type: string
        type:
          type: string
        status:
          type: string
        description:
          type: string
        priority:
          type: string
        occurrenceScope:
          type: string
      example:
        orderId: 1
        monitor: pedro
        moment: exposicao
        type: falta_peca
        status: aberto
        description: a
        priority: media
        occurrenceScope: product
    create_consignment:
      type: object
      properties:
        destinationId:
          type: integer
        monitorId:
          type: integer
        status:
          type: string
        monitorProfit:
          type: integer
      example:
        destinationId: 1
        monitorId: 1
        status: RASCUNHO
        monitorProfit: 3
    create_monitor:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: object
          properties:
            street:
              type: string
            number:
              type: string
            neighborhood:
              type: string
            city:
              type: string
            state:
              type: string
            cep:
              type: string
      example:
        name: pedro
        email: pedro@gmail.com
        phone: '27998209673'
        address:
          street: Rua Nova
          number: '50'
          neighborhood: Bairro
          city: Campinas
          state: SP
          cep: '13000000'
    create_pickup_location:
      type: object
      properties:
        name:
          type: string
        datetime:
          type: string
        address:
          type: object
          properties:
            street:
              type: string
            number:
              type: string
            neighborhood:
              type: string
            city:
              type: string
            state:
              type: string
            cep:
              type: string
            complement:
              type: string
      example:
        name: ponto
        datetime: '2024-03-25T14:05:43'
        address:
          street: Rua Nova
          number: '50'
          neighborhood: Bairro
          city: Campinas
          state: SP
          cep: '13000000'
          complement: Opcional
    create_product:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: string
        category:
          type: string
        stock:
          type: string
        featured:
          type: string
        discount:
          type: string
        allowCustomName:
