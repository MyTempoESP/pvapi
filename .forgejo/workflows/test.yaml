name: Go Build Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: docker
    container:
        network: "host"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify Environment
        run: |
          node -v
          go version

      - name: Build Binary
        run: |
          go mod download
          CGO_ENABLED=0 go build -o pvapi p .

      - name: Archive Production Binary
        uses: actions/upload-artifact@v4
        with:
          name: pvapi-binary
          path: pvapi
